services:
  dns-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dns-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - path: .env
        required: false
    
    mem_limit: 256m
    cpus: 0.5
